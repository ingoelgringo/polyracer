<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polyracer</title>
<link rel="icon" href="data:,">
<!-- Fallback TV page for old smart TV browsers. Mirrors Canvas.module.css, but
     without inset, flex gap or grid, which Chrome 47 doesn't have. -->
<style>
  * { box-sizing: border-box; padding: 0; margin: 0; }
  html, body {
    height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #canvas { display: block; width: 100vw; height: 100vh; }

  #overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .card { pointer-events: auto; background: rgba(12, 14, 20, 0.88); border: 1px solid rgba(214, 213, 212, 0.25); border-radius: 20px; padding: 28px 36px; box-shadow: 0 20px 60px rgba(0,0,0,.5); text-align: center; max-width: 92vw; color: #fff; }
  .card h1 { margin: 0 0 4px; font-size: 44px; letter-spacing: 3px; font-weight: 900; }
  .card h1 span { color: #ffd23f; }
  .sub { margin: 0 0 18px; opacity: .8; font-size: 18px; }
  .big { font-size: 72px; font-weight: 900; margin: 8px 0; }
  .join { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; }
  .join > * { margin: 0 14px; }
  .qr { display: block; margin: 0 auto; width: 300px; height: 300px; border-radius: 12px; background: #fff; padding: 8px; image-rendering: pixelated; }
  .url { font-family: ui-monospace, monospace; font-size: 18px; background: rgba(255,255,255,.1); padding: 6px 10px; border-radius: 8px; margin-top: 10px; display: inline-block; }
  .side { text-align: left; min-width: 260px; }
  .side h2 { margin: 0 0 10px; font-size: 20px; }
  .players { list-style: none; padding: 0; margin: 0 0 14px; }
  .players li, .results li { display: flex; align-items: center; font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .results li { font-size: 26px; display: list-item; margin-bottom: 8px; }
  .dot { display: inline-block; width: 18px; height: 18px; border-radius: 5px; flex: none; margin-right: 10px; }
  .empty { opacity: .6; font-weight: 400 !important; font-size: 17px !important; }
  .hint { opacity: .75; font-size: 15px; line-height: 1.6; }
  .results { text-align: left; padding-left: 36px; margin: 18px 0; }
  .stat { opacity: .65; font-size: 18px; margin-left: 12px; font-weight: 400; }
  #banner { position: fixed; top: 16px; left: 50%; -webkit-transform: translateX(-50%); transform: translateX(-50%); background: #c0392b; color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 600; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="overlay" style="display:none"></div>
<div id="banner" style="display:none"></div>
<script src="/tv.js"></script>
</body>
</html>
